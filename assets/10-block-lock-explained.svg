<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="100%" height="auto" role="img" aria-label="Monero 10-Block Output Lock Explained">
  <rect width="1200" height="410" rx="14" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <text x="36" y="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="800" fill="#f0f6fc">Why &quot;Not Enough Unlocked Money&quot; Happens After a Small Payment</text>
  <text x="36" y="66" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" fill="#8b949e">Like physical cash, Monero spends an entire existing output (note) and returns the remainder as a new change output locked for 10 blocks (~20 min)</text>

  <!-- Step 1: Before Payment -->
  <g transform="translate(36, 98)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="330" height="274" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <rect width="330" height="38" rx="10" fill="#102418"/>
    <text x="18" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#3fb950">1. Before Payment (1 Single Output)</text>

    <rect x="20" y="58" width="290" height="90" rx="8" fill="#0d1117" stroke="#3fb950" stroke-width="1.5"/>
    <text x="36" y="86" font-size="14" font-weight="700" fill="#f0f6fc">Output #A: 5.0000 XMR</text>
    <text x="36" y="110" font-size="12" fill="#3fb950">Status: Unlocked (50+ confirmations)</text>
    <text x="36" y="130" font-size="11" fill="#8b949e">Received in a single earlier transaction</text>

    <text x="20" y="182" font-size="12.5" fill="#c9d1d9">Total Balance    : 5.0000 XMR</text>
    <text x="20" y="206" font-size="12.5" fill="#3fb950" font-weight="700">Unlocked Balance : 5.0000 XMR</text>
    <text x="20" y="242" font-size="11.5" fill="#8b949e">You now send 0.20 XMR to a merchant...</text>
  </g>

  <text x="394" y="235" font-family="ui-monospace, monospace" font-size="24" font-weight="700" fill="#ff6600">→</text>

  <!-- Step 2: Transaction Splits the Output -->
  <g transform="translate(432, 98)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="336" height="274" rx="10" fill="#161b22" stroke="#ff6600" stroke-width="1.5"/>
    <rect width="336" height="38" rx="10" fill="#24160e"/>
    <text x="18" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ff6600">2. Transaction Consumes Output #A</text>

    <rect x="20" y="56" width="296" height="58" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="32" y="78" font-size="12.5" font-weight="700" fill="#f0f6fc">To Merchant: 0.2000 XMR</text>
    <text x="32" y="98" font-size="11" fill="#8b949e">+ Network Fee: ~0.00004 XMR</text>

    <rect x="20" y="128" width="296" height="72" rx="6" fill="#1f1a10" stroke="#d29922" stroke-width="1.5"/>
    <text x="32" y="152" font-size="12.5" font-weight="700" fill="#d29922">Back to You (Change #B): 4.79996 XMR</text>
    <text x="32" y="172" font-size="11.5" fill="#f0f6fc">Sent to a fresh stealth output in your wallet</text>
    <text x="32" y="190" font-size="11" fill="#d29922">Locked until 10 blocks (~20 min) pass</text>

    <text x="20" y="232" font-size="11.5" fill="#8b949e">Why? Consensus rule prevents ring-signature</text>
    <text x="20" y="250" font-size="11.5" fill="#8b949e">chains from breaking during short reorgs.</text>
  </g>

  <text x="794" y="235" font-family="ui-monospace, monospace" font-size="24" font-weight="700" fill="#ff6600">→</text>

  <!-- Step 3: During the 20-Minute Window -->
  <g transform="translate(832, 98)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <rect width="332" height="274" rx="10" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <rect width="332" height="38" rx="10" fill="#261d0f"/>
    <text x="18" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#d29922">3. Next 20 Minutes (Blocks 0 to 9)</text>

    <text x="20" y="68" font-size="12.5" fill="#c9d1d9">Total Balance    : 4.79996 XMR</text>
    <text x="20" y="92" font-size="12.5" fill="#f85149" font-weight="700">Unlocked Balance : 0.00000 XMR</text>

    <rect x="20" y="114" width="292" height="66" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="32" y="138" font-size="11.5" fill="#f0f6fc" font-weight="700">When does it unlock?</text>
    <text x="32" y="158" font-size="11.5" fill="#3fb950">Automatically at 10 confirmations.</text>

    <rect x="20" y="192" width="292" height="64" rx="6" fill="#0d1117" stroke="#238636"/>
    <text x="32" y="214" font-size="11.5" fill="#3fb950" font-weight="700">Pro Tip: Avoid future lockups</text>
    <text x="32" y="232" font-size="11" fill="#c9d1d9">Keep 2–3 separate outputs in your wallet</text>
    <text x="32" y="248" font-size="11" fill="#c9d1d9">so one is always unlocked while another waits.</text>
  </g>
</svg>
